# DB — 로컬: 기본값 사용, Railway/Neon: DATABASE_URL 환경변수로 주입
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:mbc}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

server.port=${PORT:1111}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jackson.time-zone=Asia/Seoul

spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'

# CORS — 배포 후 Vercel URL 추가: CORS_ALLOWED_ORIGINS 환경변수에 콤마 구분으로 설정
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://골든타임.net,https://www.골든타임.net,https://xn--bb0b44mb8pfwi.net,https://www.xn--bb0b44mb8pfwi.net}

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.path=static/images/

# 크로스오리진(Vercel↔Railway) 세션 쿠키 설정
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# OCR 서버 URL — Railway에 OCR 배포 후 환경변수로 교체
app.ocr.url=${OCR_SERVICE_URL:http://localhost:8000}

# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:goldentime-videos}

