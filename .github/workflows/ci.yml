# -----------------------------------------------------------------------------
# GoldenTime CI — 유지보수 시 여기만 보면 됩니다.
#   • Vue 프론트(golden/)는 로컬에서 빌드 후 goldentime/src/main/resources/static 에 반영·커밋하는
#     흐름이므로, CI에서는 별도 npm 빌드를 하지 않습니다 (백엔드 JAR에 정적 리소스 포함).
#   • Java 버전·모노레포 경로: 아래 env 블록
#   • 트리거 브랜치: on.push / on.pull_request
#   • OCR 전체 pip 설치는 무겁기 때문에 CI에서는 num/ 문법 검사만 수행
#   • checkout/setup-* 액션은 Node 24 런타임 버전 사용 (GHA Node 20 deprecation 대응)
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  DIR_BACKEND: goldentime
  DIR_PYTHON: num

jobs:
  backend:
    name: backend — Gradle test + bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.DIR_BACKEND }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: chmod +x gradlew
        run: chmod +x gradlew

      - name: Gradle test & bootJar
        run: ./gradlew test bootJar --no-daemon

  python-syntax:
    # job.name 에서는 env 를 쓸 수 없음 — 표시용 이름은 리터럴로 유지 (경로는 아래 env.DIR_PYTHON)
    name: python — compileall (num/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: compileall (no pip install)
        run: python3 -m compileall ${{ env.DIR_PYTHON }} -q
